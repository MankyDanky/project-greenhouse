# The 0.6B Gaggle backbone, castorini/gaggle-nanochat-0.6b-pretrained-climbmix-20261121: the d34 recipe on the
# 0.6B shape chosen by a 7B-token shape sweep. These are the settings of the released run (8 x H100,
# 2026-11-19 to 11-21, no distillation); the released checkpoint is its final one, step 229,067.
run: d28x1024-climbmix
attention: fa3
gpus: 8                             # the run: one node of 8 x H100 SXM 80GB
train_args:
  depth: 28                         # 28 layers x width 1,024 (aspect ratio 36), 8 heads of 128
  aspect-ratio: 36
  ve-every: 7                       # value embeddings on layers 6, 13, 20 and 27: 4 tables
  fp8: true
  fp8-recipe: tensorwise
  # As the 0.9B run: the 2M batch from step 136,317, no half batch at the end.
  batch-schedule: "262144:10e9,524288:30.4e9,1048576:92537823232,2097152"
  target-tokens: 287049515008
  warmdown-ratio: 0.5528
  weight-decay-batch-cap: 1048576
  matrix-lr: 0.02
  device-batch-size: 16             # 8 GPUs x 16 x 2048 = 262,144 tokens per micro-step
  eval-every: 1000
  core-metric-every: 5000
  sample-every: -1
  save-every: 500
  keep-checkpoints: 2
  log-every: 50

# Control: as many training tokens as the arm it controls (ir_r25 by default), all of it pre-training data (ClimbMix).
# Separates the effect of the corpus from the effect of simply training (and re-annealing) longer.
# Before building it, set `replay.tokens` to that arm's totals.train_tokens in data/<arm>/manifest.json. Its replay
# documents start with the same stream as every other arm's.
extends: ir_r25.yaml
name: control_replay_only
out_dir: data/control_replay_only
corpus: []
heldout: {fraction: 0.0, max_docs_per_source: 0}
replay:
  fraction: 1.0
  tokens: 4400000000              # placeholder (ir_r25 is about 4.4B): set it

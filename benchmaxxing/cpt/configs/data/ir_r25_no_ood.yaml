# Option: ir_r25 without the four out-of-domain collections (TREC-COVID, NFCorpus, Robust04, TREC-News), so they
# stay out of domain for the CPT model as they are for the fine-tuning data. The mix is sized without them. BEIR is
# then FiQA, SciDocs and SciFact (~18M tokens, ~72M at 4 passes), so it gets its own default ratios, 1 : 4 : 4:
# BEIR ~72M (sets the size), MS MARCO v1 ~0.29B (~40% of its passages), MS MARCO v2 ~0.29B (~3.5%); corpus ~0.65B
# tokens, ~0.86B with 25% replay. At 1 : 1 : 1 it would be only ~0.22B. Needs no pyserini: the out-of-domain
# sources are never read.
extends: ir_r25.yaml
name: ir_r25_no_ood
out_dir: data/ir_r25_no_ood
exclude_ood: true
groups:
  beir:       {ratio: 1}
  msmarco-v1: {ratio: 4}
  msmarco-v2: {ratio: 4}

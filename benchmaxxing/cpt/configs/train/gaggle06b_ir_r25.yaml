# CPT of the 0.6B Gaggle base model on the ir_r25 mix. The sweeps run on this model (replay share, LR probe, control,
# leave-one-out); see PLAN.md. Every other gaggle06b_* config extends this one.
#
# THE 0.6B MODEL IS NOT RELEASED YET. When it is, fill in the three placeholders below (and its repo and step in
# fetch_models.sh); train.py refuses to run until then. Everything else (architecture, the original run's learning
# rates) is read from the checkpoint's meta_<step>.json.
extends: gaggle3b_ir_r25.yaml
run: gaggle06b_ir_r25
init:
  dir:                                  # PLACEHOLDER: models/<the 0.6B Hugging Face repo name>
  step:                                 # PLACEHOLDER: the released step
weight_decay:                           # PLACEHOLDER: the original run's Muon weight-decay amplitude, used as is
device_batch_size: 32                   # 2,048-token sequences per GPU per micro-step
rerank_config: benchmaxxing/cpt/configs/rerank/gaggle06b_lce.yaml

# Released as castorini/gaggle-reranker-0.9b-20261108; beyond the paper's rows.
# Expected mean nDCG@10 (BM25 top-100): TREC DL 0.632, BEIR 0.533.
# Original run: 1x H200, 117,147-token budget, 1,928 updates.
# Engine: nanochat.  Train: bash launch/train.sh configs/experiments/gaggle09b_lce.yaml 1   (from reranker/)
# Backbone: bash data_prep/fetch_models.sh gaggle-0.9b
#
# Run 1's recipe (configs/sft/run1_seed17.yaml) on the 0.9B Gaggle backbone. Differences, all from the backbone:
#   * backbone: castorini/gaggle-nanochat-0.9b-pretrained-climbmix-20261105, step 229,067 (the end of its 287B-token
#     ClimbMix pass): nanochat d32 x 1152 with value embeddings on every 4th layer (ve_every 4, read from the
#     checkpoint's meta). Same 32,768-token tokenizer as run 1, so the same answer ids (2737 / 7863) and data lengths.
#   * one GPU and a larger per-GPU budget: weights, gradients and AdamW state are 15.7 GiB here (run 1: 50.9 GiB), so
#     at 1.0 GiB per 1k tokens an H200 fits 117,147 tokens per micro-batch. The budget and pack_world are pinned to
#     the original run's, so the same query groups land in the same optimizer steps.
# Everything else is run 1's: same data rows, LCE at tau = 1, 512/128 truncation, 128-group global batch,
# AdamW 5e-5 with 150 warmup steps and cosine decay, fp32 with TF32 matmuls, seed 17.

# ---- model, prompt, data -----------------------------------------------------------------
backbone_impl: upstream     # src/modeling_nanochat_upstream.py: nanochat's own GPT class
model_name: models/gaggle-nanochat-0.9b-pretrained-climbmix-20261105   # checkpoint dir: model_229067.pt + meta_229067.json + tokenizer.json
nanochat_src: third_party/nanochat-92d63d4   # nanochat @ 92d63d4 + its ve_every patch (NANOCHAT_DTYPE=float32)
prompt: nochat              # "<|bos|>Query: {query}\nPassage: {passage}\nRelevant:"  score = logit(" true") - logit(" false")
train_parquet: data/rlhn250k_prepared_climbmix_lens/train.parquet   # RLHN-250K, lengths from the 32k tokenizer
output_dir: checkpoints/gaggle09b_lce
max_doc_len: 512
max_query_len: 128

# ---- model setup ----------------------------------------------------------------------------
lora: false                 # full fine-tuning of all 0.85B parameters
attn_implementation: sdpa   # upstream picks its SDPA path automatically in fp32 (its FA3 kernels are bf16-only)
precision: tf32             # fp32 weights, activations and optimizer state; TF32 matmuls; no autocast
grad_checkpointing: true

# ---- loss --------------------------------------------------------------------------------
tau: 1.0                    # LCE only
w_rkd: 0.0                  # no rank distillation (this data has no teacher ranks)

# ---- batching ---------------------------------------------------------------------------
k_choices: [7, 15, 23]
global_batch_groups: 128    # groups per optimizer step, independent of GPU count and memory
max_groups: 32
max_tokens_per_batch: 117147   # PINNED: the per-GPU budget of the original run on one H200 (141 GB); what the memory model gave there
pack_world: 1               # pack as on the original run's single GPU
require_exact_budget: true  # stop instead of silently repacking on a GPU that cannot afford the budget
mem_per_1k_tok_gib: 1.0

# ---- optimization ------------------------------------------------------------------------
seed: 17
epochs: 1
lr: 5.0e-5
weight_decay: 0.01
warmup_steps: 150
clip: 12.0

# ---- bookkeeping (no effect on training) ----------------------------------------------------
num_workers: 6
resume: auto
save_every: 200
keep_ckpts: 1
log_every: 20
wandb_project:              # set a W&B project name to log the run
wandb_entity:
wandb_run_name: gaggle09b_lce
wandb_group:
wandb_tags: [rlhn250k, gaggle-0.9b, pointwise, lce]
